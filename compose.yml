name: cilexec

x-cilexec-image: &cilexec-image
  image: ${CILEXEC_IMAGE:-cilexec:local}
  build:
    context: .
    dockerfile: Dockerfile
    target: ${CILEXEC_DOCKER_TARGET:-runtime}
    args:
      BUILD_VERSION: ${CILEXEC_BUILD_VERSION:-0.0.1}
      BUILD_REVISION: ${CILEXEC_BUILD_REVISION:-development}
      BUILD_SOURCE: ${CILEXEC_BUILD_SOURCE:-https://github.com/SuHeling1212/cilexec}

x-cilexec-environment: &cilexec-environment
  CILEXEC_INSTANCE_NAME: ${CILEXEC_INSTANCE_NAME:-cilexec}
  CILEXEC_ADVISORY_LOCK_KEY: ${CILEXEC_ADVISORY_LOCK_KEY:-4848202279983169603}
  CILEXEC_DATABASE_URL: jdbc:postgresql://postgres:5432/${CILEXEC_DATABASE_NAME:-cilexec}
  CILEXEC_DATABASE_CONNECTION_TIMEOUT: ${CILEXEC_DATABASE_CONNECTION_TIMEOUT:-PT10S}
  CILEXEC_DATABASE_VALIDATION_TIMEOUT: ${CILEXEC_DATABASE_VALIDATION_TIMEOUT:-PT5S}
  CILEXEC_DATABASE_STATEMENT_TIMEOUT: ${CILEXEC_DATABASE_STATEMENT_TIMEOUT:-PT30S}
  CILEXEC_DATABASE_SSL_ROOT_CERTIFICATE_FILE: /run/cilexec-tls/ca.crt
  CILEXEC_RUNTIME_DATABASE_USER: cilexec_runtime
  CILEXEC_RUNTIME_DATABASE_PASSWORD_FILE: /run/secrets/cilexec_runtime_password
  CILEXEC_RUNTIME_POOL_MAX: ${CILEXEC_RUNTIME_POOL_MAX:-20}
  CILEXEC_RUNTIME_POOL_MIN_IDLE: ${CILEXEC_RUNTIME_POOL_MIN_IDLE:-2}
  CILEXEC_EFFECT_DATABASE_USER: cilexec_effect_worker
  CILEXEC_EFFECT_DATABASE_PASSWORD_FILE: /run/secrets/cilexec_effect_worker_password
  CILEXEC_EFFECT_POOL_MAX: ${CILEXEC_EFFECT_POOL_MAX:-6}
  CILEXEC_EFFECT_POOL_MIN_IDLE: ${CILEXEC_EFFECT_POOL_MIN_IDLE:-1}
  CILEXEC_MIGRATOR_DATABASE_USER: cilexec_migrator
  CILEXEC_MIGRATOR_DATABASE_PASSWORD_FILE: /run/secrets/cilexec_migrator_password
  CILEXEC_MIGRATOR_POOL_MAX: ${CILEXEC_MIGRATOR_POOL_MAX:-2}
  CILEXEC_MIGRATOR_POOL_MIN_IDLE: ${CILEXEC_MIGRATOR_POOL_MIN_IDLE:-0}
  CILEXEC_EXPORTER_DATABASE_USER: cilexec_exporter
  CILEXEC_EXPORTER_DATABASE_PASSWORD_FILE: /run/secrets/cilexec_exporter_password
  CILEXEC_EXPORTER_POOL_MAX: ${CILEXEC_EXPORTER_POOL_MAX:-1}
  CILEXEC_EXPORTER_POOL_MIN_IDLE: ${CILEXEC_EXPORTER_POOL_MIN_IDLE:-0}
  CILEXEC_SCHEDULER_WORKERS: ${CILEXEC_SCHEDULER_WORKERS:-10}
  CILEXEC_LEASE_DURATION: ${CILEXEC_LEASE_DURATION:-PT30S}
  CILEXEC_SCHEDULER_ERROR_BACKOFF: ${CILEXEC_SCHEDULER_ERROR_BACKOFF:-PT0.025S}
  CILEXEC_EFFECT_WORKERS: ${CILEXEC_EFFECT_WORKERS:-6}
  CILEXEC_EFFECT_ERROR_BACKOFF: ${CILEXEC_EFFECT_ERROR_BACKOFF:-PT0.025S}
  CILEXEC_SHUTDOWN_GRACE: ${CILEXEC_SHUTDOWN_GRACE:-PT30S}
  CILEXEC_HEALTH_PORT: ${CILEXEC_HEALTH_PORT:-8080}
  CILEXEC_HEALTH_DATABASE_PROBE_INTERVAL: ${CILEXEC_HEALTH_DATABASE_PROBE_INTERVAL:-PT10S}
  CILEXEC_MIGRATE_ON_START: ${CILEXEC_MIGRATE_ON_START:-false}
  CILEXEC_TERMINAL_USERNAME: ${CILEXEC_TERMINAL_USERNAME:-local}
  CILEXEC_TERMINAL_PORT: ${CILEXEC_TERMINAL_PORT:-8022}
  CILEXEC_NETWORK_ALLOW_PRIVATE_HTTP_ORIGINS: ${CILEXEC_NETWORK_ALLOW_PRIVATE_HTTP_ORIGINS:-}
  CILEXEC_FCL_EXEC_ALLOWLIST: ${CILEXEC_FCL_EXEC_ALLOWLIST:-}
  JAVA_TOOL_OPTIONS: ${CILEXEC_JAVA_TOOL_OPTIONS:--Dorg.sqlite.tmpdir=/var/cache/cilexec/sqlite-native -XX:MaxRAMPercentage=75.0 -XX:MaxMetaspaceSize=256m}

x-cilexec-hardening: &cilexec-hardening
  user: "${CILEXEC_CONTAINER_UID:-10001}:${CILEXEC_CONTAINER_GID:-10001}"
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  stop_grace_period: ${CILEXEC_SHUTDOWN_GRACE_SECONDS:-30s}

services:
  postgres:
    image: ${CILEXEC_POSTGRES_IMAGE:-postgres:17.10-bookworm@sha256:9b18b78397054fce88a9552e9d5a3ad5bb7fd258c5b3cc1c5028e46373d6ea8f}
    restart: "no"
    environment:
      POSTGRES_USER: cilexec_bootstrap
      POSTGRES_DB: postgres
      PGDATA: /var/lib/postgresql/cilexec-ephemeral
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=trust
      CILEXEC_DATABASE_NAME: ${CILEXEC_DATABASE_NAME:-cilexec}
      CILEXEC_MIGRATOR_PASSWORD_FILE: /run/secrets/cilexec_migrator_password
      CILEXEC_RUNTIME_PASSWORD_FILE: /run/secrets/cilexec_runtime_password
      CILEXEC_EFFECT_PASSWORD_FILE: /run/secrets/cilexec_effect_worker_password
      CILEXEC_READONLY_PASSWORD_FILE: /run/secrets/cilexec_readonly_password
      CILEXEC_EXPORTER_PASSWORD_FILE: /run/secrets/cilexec_exporter_password
    entrypoint: ["/usr/local/bin/cilexec-postgres-entrypoint"]
    secrets:
      - postgres_admin_password
      - cilexec_migrator_password
      - cilexec_runtime_password
      - cilexec_effect_worker_password
      - cilexec_readonly_password
      - cilexec_exporter_password
    volumes:
      - type: bind
        source: ./docker/postgres/init
        target: /docker-entrypoint-initdb.d
        read_only: true
      - type: bind
        source: ./docker/postgres/entrypoint.sh
        target: /usr/local/bin/cilexec-postgres-entrypoint
        read_only: true
      - type: bind
        source: ./docker/secrets/postgres-ca.crt
        target: /run/cilexec-tls/ca.crt
        read_only: true
      - type: bind
        source: ./docker/secrets/postgres-server.crt
        target: /run/cilexec-tls/server.crt
        read_only: true
      - type: bind
        source: ./docker/secrets/postgres-server.key
        target: /run/cilexec-tls/server.key
        read_only: true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --quiet --username cilexec_migrator --dbname ${CILEXEC_DATABASE_NAME:-cilexec}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    stop_grace_period: 30s
    mem_limit: ${CILEXEC_POSTGRES_MEMORY_LIMIT:-1g}
    pids_limit: ${CILEXEC_POSTGRES_PIDS_LIMIT:-256}
    cpus: ${CILEXEC_POSTGRES_CPUS:-2.0}
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    logging:
      driver: local
      options:
        max-size: "20m"
        max-file: "5"

  migrate:
    <<: [*cilexec-image, *cilexec-hardening]
    command: ["migrate"]
    restart: "no"
    environment:
      <<: *cilexec-environment
    secrets:
      - cilexec_migrator_password
    volumes:
      - ./docker/secrets/postgres-ca.crt:/run/cilexec-tls/ca.crt:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,uid=${CILEXEC_CONTAINER_UID:-10001},gid=${CILEXEC_CONTAINER_GID:-10001}
    healthcheck:
      disable: true
    mem_limit: ${CILEXEC_MIGRATE_MEMORY_LIMIT:-1024m}
    pids_limit: ${CILEXEC_JAVA_PIDS_LIMIT:-256}
    cpus: ${CILEXEC_MIGRATE_CPUS:-1.0}
    depends_on:
      postgres:
        condition: service_healthy
        restart: true

  cilexec:
    <<: [*cilexec-image, *cilexec-hardening]
    command: ["terminal"]
    restart: "no"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      <<: *cilexec-environment
    secrets:
      - cilexec_runtime_password
      - cilexec_effect_worker_password
    volumes:
      - ./docker/secrets/postgres-ca.crt:/run/cilexec-tls/ca.crt:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=160m,uid=${CILEXEC_CONTAINER_UID:-10001},gid=${CILEXEC_CONTAINER_GID:-10001}
      - /var/cache/cilexec/packages:rw,noexec,nosuid,size=${CILEXEC_PACKAGE_CACHE_SIZE:-256m},uid=${CILEXEC_CONTAINER_UID:-10001},gid=${CILEXEC_CONTAINER_GID:-10001}
      - /var/cache/cilexec/sqlite-native:rw,exec,nosuid,size=32m,uid=${CILEXEC_CONTAINER_UID:-10001},gid=${CILEXEC_CONTAINER_GID:-10001}
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
      migrate:
        condition: service_completed_successfully
    mem_limit: ${CILEXEC_RUNTIME_MEMORY_LIMIT:-2048m}
    pids_limit: ${CILEXEC_JAVA_PIDS_LIMIT:-256}
    cpus: ${CILEXEC_RUNTIME_CPUS:-2.0}
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    logging:
      driver: local
      options:
        max-size: "20m"
        max-file: "5"

  export:
    <<: [*cilexec-image, *cilexec-hardening]
    profiles: ["tools"]
    command: ["export", "/exports/${CILEXEC_EXPORT_FILE:-cilexec-export.db}"]
    restart: "no"
    environment:
      <<: *cilexec-environment
    secrets:
      - cilexec_exporter_password
    volumes:
      - type: bind
        source: ${CILEXEC_EXPORT_DIRECTORY:-./exports}
        target: /exports
      - type: bind
        source: ./docker/secrets/postgres-ca.crt
        target: /run/cilexec-tls/ca.crt
        read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,uid=${CILEXEC_CONTAINER_UID:-10001},gid=${CILEXEC_CONTAINER_GID:-10001}
      - /var/cache/cilexec/sqlite-native:rw,exec,nosuid,size=32m,uid=${CILEXEC_CONTAINER_UID:-10001},gid=${CILEXEC_CONTAINER_GID:-10001}
    healthcheck:
      disable: true
    mem_limit: ${CILEXEC_EXPORT_MEMORY_LIMIT:-2048m}
    pids_limit: ${CILEXEC_JAVA_PIDS_LIMIT:-256}
    cpus: ${CILEXEC_EXPORT_CPUS:-1.0}
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
      migrate:
        condition: service_completed_successfully

secrets:
  postgres_admin_password:
    file: ${CILEXEC_POSTGRES_ADMIN_PASSWORD_FILE:-./docker/secrets/postgres-admin-password}
  cilexec_migrator_password:
    file: ${CILEXEC_MIGRATOR_PASSWORD_FILE:-./docker/secrets/cilexec-migrator-password}
  cilexec_runtime_password:
    file: ${CILEXEC_RUNTIME_PASSWORD_FILE:-./docker/secrets/cilexec-runtime-password}
  cilexec_effect_worker_password:
    file: ${CILEXEC_EFFECT_PASSWORD_FILE:-./docker/secrets/cilexec-effect-worker-password}
  cilexec_readonly_password:
    file: ${CILEXEC_READONLY_PASSWORD_FILE:-./docker/secrets/cilexec-readonly-password}
  cilexec_exporter_password:
    file: ${CILEXEC_EXPORTER_PASSWORD_FILE:-./docker/secrets/cilexec-exporter-password}
