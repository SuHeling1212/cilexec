# Standalone profile for an externally managed PostgreSQL database.
# The DBA must run docker/postgres/init/00-cilexec-bootstrap.sh equivalent SQL first.
name: cilexec-external

x-cilexec-image: &cilexec-image
  image: cilexec:${CILEXEC_IMAGE_TAG:-local}
  build:
    context: .
    dockerfile: Dockerfile

x-cilexec-environment: &cilexec-environment
  CILEXEC_INSTANCE_NAME: ${CILEXEC_INSTANCE_NAME:-cilexec}
  CILEXEC_ADVISORY_LOCK_KEY: ${CILEXEC_ADVISORY_LOCK_KEY:-4848202279983169603}
  CILEXEC_DATABASE_URL: ${CILEXEC_DATABASE_URL:?set CILEXEC_DATABASE_URL to an external PostgreSQL JDBC URL}
  CILEXEC_DATABASE_CONNECTION_TIMEOUT: ${CILEXEC_DATABASE_CONNECTION_TIMEOUT:-PT10S}
  CILEXEC_DATABASE_VALIDATION_TIMEOUT: ${CILEXEC_DATABASE_VALIDATION_TIMEOUT:-PT5S}
  CILEXEC_RUNTIME_DATABASE_USER: cilexec_runtime
  CILEXEC_RUNTIME_DATABASE_PASSWORD_FILE: /run/secrets/cilexec_runtime_password
  CILEXEC_RUNTIME_POOL_MAX: ${CILEXEC_RUNTIME_POOL_MAX:-8}
  CILEXEC_RUNTIME_POOL_MIN_IDLE: ${CILEXEC_RUNTIME_POOL_MIN_IDLE:-2}
  CILEXEC_EFFECT_DATABASE_USER: cilexec_effect_worker
  CILEXEC_EFFECT_DATABASE_PASSWORD_FILE: /run/secrets/cilexec_effect_worker_password
  CILEXEC_EFFECT_POOL_MAX: ${CILEXEC_EFFECT_POOL_MAX:-4}
  CILEXEC_EFFECT_POOL_MIN_IDLE: ${CILEXEC_EFFECT_POOL_MIN_IDLE:-1}
  CILEXEC_MIGRATOR_DATABASE_USER: cilexec_migrator
  CILEXEC_MIGRATOR_DATABASE_PASSWORD_FILE: /run/secrets/cilexec_migrator_password
  CILEXEC_MIGRATOR_POOL_MAX: ${CILEXEC_MIGRATOR_POOL_MAX:-2}
  CILEXEC_MIGRATOR_POOL_MIN_IDLE: ${CILEXEC_MIGRATOR_POOL_MIN_IDLE:-0}
  CILEXEC_SCHEDULER_WORKERS: ${CILEXEC_SCHEDULER_WORKERS:-4}
  CILEXEC_LEASE_DURATION: ${CILEXEC_LEASE_DURATION:-PT30S}
  CILEXEC_HEARTBEAT_INTERVAL: ${CILEXEC_HEARTBEAT_INTERVAL:-PT10S}
  CILEXEC_EFFECT_WORKERS: ${CILEXEC_EFFECT_WORKERS:-2}
  CILEXEC_SHUTDOWN_GRACE: ${CILEXEC_SHUTDOWN_GRACE:-PT30S}
  CILEXEC_HEALTH_PORT: 8080
  CILEXEC_MIGRATE_ON_START: "false"

x-cilexec-hardening: &cilexec-hardening
  user: "10001:10001"
  read_only: true
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]
  stop_grace_period: ${CILEXEC_SHUTDOWN_GRACE_SECONDS:-30s}

services:
  migrate:
    <<: [*cilexec-image, *cilexec-hardening]
    command: ["migrate"]
    restart: "no"
    environment:
      <<: *cilexec-environment
    secrets:
      - cilexec_migrator_password
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,uid=10001,gid=10001
    healthcheck:
      disable: true

  cilexec:
    <<: [*cilexec-image, *cilexec-hardening]
    command: ["runtime"]
    restart: unless-stopped
    environment:
      <<: *cilexec-environment
    secrets:
      - cilexec_runtime_password
      - cilexec_effect_worker_password
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,uid=10001,gid=10001
      - /var/cache/cilexec/packages:rw,noexec,nosuid,size=${CILEXEC_PACKAGE_CACHE_SIZE:-256m},uid=10001,gid=10001
    ports:
      - "127.0.0.1:${CILEXEC_HEALTH_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

secrets:
  cilexec_migrator_password:
    file: ${CILEXEC_MIGRATOR_PASSWORD_FILE:-./docker/secrets/cilexec-migrator-password}
  cilexec_runtime_password:
    file: ${CILEXEC_RUNTIME_PASSWORD_FILE:-./docker/secrets/cilexec-runtime-password}
  cilexec_effect_worker_password:
    file: ${CILEXEC_EFFECT_PASSWORD_FILE:-./docker/secrets/cilexec-effect-worker-password}
