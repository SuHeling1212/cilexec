# Non-secret defaults. Container profiles override the JDBC host and secret paths.
instance.name=cilexec
instance.lock-key=4848202279983169603

database.url=jdbc:postgresql://127.0.0.1:5432/cilexec
database.connection-timeout=PT10S
database.validation-timeout=PT5S
database.statement-timeout=PT30S
database.migrate-on-start=false
database.ssl-root-certificate-file=

runtime.database.user=cilexec_runtime
runtime.database.password-file=/run/secrets/cilexec_runtime_password
runtime.pool.max=20
runtime.pool.min-idle=2

effect.database.user=cilexec_effect_worker
effect.database.password-file=/run/secrets/cilexec_effect_worker_password
effect.pool.max=6
effect.pool.min-idle=1

migrator.database.user=cilexec_migrator
migrator.database.password-file=/run/secrets/cilexec_migrator_password
migrator.pool.max=2
migrator.pool.min-idle=0

exporter.database.user=cilexec_exporter
exporter.database.password-file=/run/secrets/cilexec_exporter_password
exporter.pool.max=1
exporter.pool.min-idle=0

scheduler.workers=10
scheduler.lease-duration=PT30S
scheduler.error-backoff=PT0.025S
effect.workers=6
effect.error-backoff=PT0.025S
runtime.shutdown-grace=PT30S
health.database-probe-interval=PT10S
health.port=8080
