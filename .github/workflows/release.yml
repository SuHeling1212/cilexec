name: release-artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'
          cache: maven
      - name: Build and verify release
        env:
          CILEXEC_BUILD_REVISION: ${{ github.sha }}
        run: python3 build/release.py
      - name: Assemble release archive
        run: |
          tar -C dist -czf cilexec-release.tar.gz \
            cilexec-app.jar cilexec-market-server.jar catalog.json repository \
            MARKET.md RELEASE.txt SHA256SUMS
      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: cilexec-${{ github.ref_name }}
          path: cilexec-release.tar.gz
          if-no-files-found: error
          retention-days: 30
