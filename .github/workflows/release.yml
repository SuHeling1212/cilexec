name: release-artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-runtime:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        postgres-image:
          - postgres:17.10-alpine3.23
          - postgres:18.0-alpine3.22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '26'
          cache: maven
      - name: Verify mandatory PostgreSQL suites
        run: >-
          mvn --batch-mode --no-transfer-progress clean verify
          -Dbuild.revision="${GITHUB_SHA}"
          -Dcilexec.test.postgres.image="${{ matrix.postgres-image }}"
      - name: Reject missing or skipped mandatory tests
        run: python3 tools/check_test_reports.py

  build:
    needs: validate-runtime
    permissions:
      contents: read
    outputs:
      image-digest: ${{ steps.image.outputs.digest }}
      image-name: ${{ steps.identity.outputs.image }}
      version: ${{ steps.identity.outputs.version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CILEXEC_BUILD_REVISION: ${{ github.sha }}
      CILEXEC_BUILD_VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '26'
          cache: maven
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Resolve release identity
        id: identity
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(sed -n 's:.*<version>\([^<]*\)</version>.*:\1:p' pom.xml | head -n1)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Build and verify release
        run: |
          args=()
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            args+=(--formal --tag "${GITHUB_REF_NAME}")
          fi
          python3 tools/release.py "${args[@]}"
          python3 tools/check_test_reports.py
      - name: Build multi-architecture OCI archive
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: release
          platforms: linux/amd64,linux/arm64
          outputs: type=oci,dest=${{ github.workspace }}/cilexec-image.oci.tar
          tags: ${{ steps.identity.outputs.image }}:build-${{ github.sha }}
          build-args: |
            BUILD_VERSION=${{ steps.identity.outputs.version }}
            BUILD_REVISION=${{ github.sha }}
            BUILD_SOURCE=${{ github.server_url }}/${{ github.repository }}
          provenance: mode=max
          sbom: true
      - name: Load exact release platform images
        run: |
          sudo apt-get update
          sudo apt-get install --yes skopeo
          for arch in amd64 arm64; do
            skopeo copy --override-os linux --override-arch "$arch" \
              oci-archive:cilexec-image.oci.tar \
              "docker-archive:/tmp/cilexec-release-${arch}.tar:cilexec:release-${arch}"
            docker load --input "/tmp/cilexec-release-${arch}.tar"
          done
      - name: Scan exact amd64 release image vulnerabilities
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7
        with:
          image: cilexec:release-amd64
          fail-build: true
          severity-cutoff: high
      - name: Scan exact arm64 release image vulnerabilities
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7
        with:
          image: cilexec:release-arm64
          fail-build: true
          severity-cutoff: high
      - name: Match exact platform images and verified Runtime JAR
        run: |
          amd64_container="$(docker create --platform linux/amd64 cilexec:release-amd64)"
          arm64_container="$(docker create --platform linux/arm64 cilexec:release-arm64)"
          trap 'docker rm -f "$amd64_container" "$arm64_container" >/dev/null 2>&1 || true' EXIT
          for arch in amd64 arm64; do
            container_variable="${arch}_container"
            container="${!container_variable}"
            docker cp "$container:/opt/cilexec/cilexec-app.jar" "/tmp/image-cilexec-app-${arch}.jar"
            cmp dist/cilexec-app.jar "/tmp/image-cilexec-app-${arch}.jar"
          done
      - name: Build amd64 and arm64 offline installers
        run: |
          version="${{ steps.identity.outputs.version }}"
          CILEXEC_SKIP_IMAGE_BUILD=true CILEXEC_TARGET_PLATFORM=linux/amd64 \
            CILEXEC_IMAGE=cilexec:release-amd64 bash build/package.sh "$version"
          CILEXEC_SKIP_IMAGE_BUILD=true CILEXEC_TARGET_PLATFORM=linux/arm64 \
            CILEXEC_IMAGE=cilexec:release-arm64 bash build/package.sh "$version"
          cp build/cilexec-"$version"-linux-amd64.sh .
          cp build/cilexec-"$version"-linux-arm64.sh .
      - name: Build native Windows PowerShell package
        run: |
          version="${{ steps.identity.outputs.version }}"
          python3 tools/release_all.py --package-only --version "$version" \
            --image-amd64 cilexec:release-amd64 \
            --image-arm64 cilexec:release-arm64 \
            --output-directory platform-release
          cp platform-release/cilexec-"$version"-windows.zip .
      - name: Reclaim packaging workspace
        run: |
          version="${{ steps.identity.outputs.version }}"
          rm -f /tmp/cilexec-release-amd64.tar /tmp/cilexec-release-arm64.tar
          rm -rf platform-release target market-server/target
          rm -f build/cilexec-"$version"-linux-amd64.sh \
            build/cilexec-"$version"-linux-arm64.sh
          docker image rm cilexec:release-amd64 cilexec:release-arm64 || true
          docker buildx prune --all --force
          df -h "$GITHUB_WORKSPACE"
      - name: Assemble deploy archive
        if: github.ref_type == 'tag'
        run: |
          version="${{ steps.identity.outputs.version }}"
          root="release-stage/cilexec-$version"
          mkdir -p "$root/docker/secrets" "$root/docs"
          cp dist/cilexec-app.jar dist/cilexec-market-server.jar dist/catalog.json \
            dist/MARKET.md dist/RELEASE.txt dist/LICENSE dist/THIRD_PARTY_NOTICES.txt \
            dist/SBOM.cdx.json dist/runtime-dependencies.txt dist/market-dependencies.txt \
            dist/release-manifest.json dist/SHA256SUMS README.md "$root/"
          cp -R dist/repository "$root/repository"
          cp compose.yml "$root/"
          mkdir -p "$root/tools"
          cp tools/Install.sh tools/Uninstall.sh tools/Shell.sh tools/Headless.sh \
            tools/HostMove.sh "$root/tools/"
          cp .env.example "$root/"
          cp docker/create-secrets.sh docker/rotate-secrets.sh docker/healthcheck.sh \
            docker/terminal-client.c "$root/docker/"
          cp -R docker/compose docker/postgres "$root/docker/"
          cp docker/secrets/.gitignore "$root/docker/secrets/"
          cp -R ops "$root/ops"
          cp docs/production-backup-restore.md docs/release.md "$root/docs/"
          cp cilexec-"$version"-linux-amd64.sh cilexec-"$version"-linux-arm64.sh "$root/"
          printf 'CILEXEC_IMAGE=%s@%s\n' \
            "${{ steps.identity.outputs.image }}" "${{ steps.image.outputs.digest }}" \
            > "$root/.env"
          tar -C release-stage -czf "cilexec-$version-deploy.tar.gz" "cilexec-$version"
          sha256sum "cilexec-$version-deploy.tar.gz" \
            cilexec-image.oci.tar \
            cilexec-"$version"-linux-amd64.sh \
            cilexec-"$version"-linux-arm64.sh \
            cilexec-"$version"-windows.zip \
            > "cilexec-$version-SHA256SUMS"
      - name: Checksum manual-run installers
        if: github.ref_type != 'tag'
        run: |
          version="${{ steps.identity.outputs.version }}"
          sha256sum cilexec-"$version"-linux-amd64.sh \
            cilexec-"$version"-linux-arm64.sh \
            cilexec-"$version"-windows.zip > "cilexec-$version-SHA256SUMS"
      - name: Upload prepared formal artifacts
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cilexec-formal-${{ steps.identity.outputs.version }}
          path: |
            cilexec-image.oci.tar
            cilexec-${{ steps.identity.outputs.version }}-deploy.tar.gz
            cilexec-${{ steps.identity.outputs.version }}-SHA256SUMS
            cilexec-${{ steps.identity.outputs.version }}-linux-*.sh
            cilexec-${{ steps.identity.outputs.version }}-windows.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Upload manual-run artifacts
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cilexec-${{ steps.identity.outputs.version }}
          path: |
            cilexec-${{ steps.identity.outputs.version }}-SHA256SUMS
            cilexec-${{ steps.identity.outputs.version }}-linux-*.sh
            cilexec-${{ steps.identity.outputs.version }}-windows.zip
          if-no-files-found: error
          retention-days: 30
  publish:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9 # v3
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cilexec-formal-${{ needs.build.outputs.version }}
          path: .
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify downloaded release artifacts
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: sha256sum -c "cilexec-${VERSION}-SHA256SUMS"
      - name: Check immutable version state
        id: immutable
        env:
          IMAGE: ${{ needs.build.outputs.image-name }}
          VERSION: ${{ needs.build.outputs.version }}
          DIGEST: ${{ needs.build.outputs.image-digest }}
        run: |
          set +e
          inspection="$(docker buildx imagetools inspect "$IMAGE:$VERSION" 2>&1)"
          status=$?
          set -e
          if [[ $status -eq 0 ]]; then
            existing="$(docker buildx imagetools inspect "$IMAGE:$VERSION" \
              --format '{{.Manifest.Digest}}')"
            if [[ "$existing" != "$DIGEST" ]]; then
              echo "Refusing to replace $IMAGE:$VERSION ($existing) with $DIGEST" >&2
              exit 1
            fi
            echo "promote=false" >> "$GITHUB_OUTPUT"
          elif [[ "$inspection" == *"not found"* || "$inspection" == *"manifest unknown"* ]]; then
            echo "promote=true" >> "$GITHUB_OUTPUT"
          else
            echo "$inspection" >&2
            echo "Cannot prove that immutable tag $IMAGE:$VERSION is absent" >&2
            exit 1
          fi
      - name: Publish prepared OCI archive
        env:
          IMAGE: ${{ needs.build.outputs.image-name }}
          DIGEST: ${{ needs.build.outputs.image-digest }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes skopeo
          skopeo copy --all --dest-creds "${GITHUB_ACTOR}:${GHCR_TOKEN}" \
            oci-archive:cilexec-image.oci.tar "docker://$IMAGE:build-${GITHUB_SHA}"
          published="$(docker buildx imagetools inspect "$IMAGE:build-${GITHUB_SHA}" \
            --format '{{.Manifest.Digest}}')"
          if [[ "$published" != "$DIGEST" ]]; then
            echo "Published image digest $published does not match $DIGEST" >&2
            exit 1
          fi
      - name: Sign OCI image and release checksums
        env:
          IMAGE: ${{ needs.build.outputs.image-name }}
          DIGEST: ${{ needs.build.outputs.image-digest }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          cosign sign --yes "$IMAGE@$DIGEST"
          cosign sign-blob --yes \
            --bundle "cilexec-${VERSION}-SHA256SUMS.sigstore.json" \
            "cilexec-${VERSION}-SHA256SUMS"
      - name: Promote immutable OCI version tag
        if: steps.immutable.outputs.promote == 'true'
        env:
          IMAGE: ${{ needs.build.outputs.image-name }}
          VERSION: ${{ needs.build.outputs.version }}
          DIGEST: ${{ needs.build.outputs.image-digest }}
        run: |
          set +e
          inspection="$(docker buildx imagetools inspect "$IMAGE:$VERSION" 2>&1)"
          status=$?
          set -e
          if [[ $status -eq 0 ]]; then
            echo "Refusing to replace concurrently created tag $IMAGE:$VERSION" >&2
            exit 1
          fi
          if [[ "$inspection" != *"not found"* && "$inspection" != *"manifest unknown"* ]]; then
            echo "$inspection" >&2
            echo "Cannot prove that immutable tag $IMAGE:$VERSION is still absent" >&2
            exit 1
          fi
          docker buildx imagetools create --tag "$IMAGE:$VERSION" "$IMAGE@$DIGEST"
          promoted="$(docker buildx imagetools inspect "$IMAGE:$VERSION" \
            --format '{{.Manifest.Digest}}')"
          if [[ "$promoted" != "$DIGEST" ]]; then
            echo "Promoted image digest $promoted does not match $DIGEST" >&2
            exit 1
          fi
      - name: Verify immutable OCI version tag
        env:
          IMAGE: ${{ needs.build.outputs.image-name }}
          VERSION: ${{ needs.build.outputs.version }}
          DIGEST: ${{ needs.build.outputs.image-digest }}
        run: |
          current="$(docker buildx imagetools inspect "$IMAGE:$VERSION" \
            --format '{{.Manifest.Digest}}')"
          if [[ "$current" != "$DIGEST" ]]; then
            echo "Immutable tag $IMAGE:$VERSION changed to $current; expected $DIGEST" >&2
            exit 1
          fi
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: false
          files: |
            cilexec-image.oci.tar
            cilexec-${{ needs.build.outputs.version }}-deploy.tar.gz
            cilexec-${{ needs.build.outputs.version }}-SHA256SUMS
            cilexec-${{ needs.build.outputs.version }}-SHA256SUMS.sigstore.json
            cilexec-${{ needs.build.outputs.version }}-linux-amd64.sh
            cilexec-${{ needs.build.outputs.version }}-linux-arm64.sh
            cilexec-${{ needs.build.outputs.version }}-windows.zip
