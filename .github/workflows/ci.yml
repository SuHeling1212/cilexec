name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        postgres-image:
          - postgres:17.10-alpine3.23
          - postgres:18.0-alpine3.22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '26'
          cache: maven
      - name: Verify host tools
        run: |
          bash -n tools/*.sh build/*.sh docker/create-secrets.sh docker/rotate-secrets.sh
          sh -n docker/healthcheck.sh docker/postgres/entrypoint.sh docker/postgres/init/00-cilexec-bootstrap.sh
          shellcheck tools/*.sh build/*.sh docker/create-secrets.sh docker/rotate-secrets.sh
          python3 -m py_compile tools/PackageBuild.py tools/check_test_reports.py tools/release.py tools/release_all.py tools/test_release.py tools/test_release_all.py
          python3 tools/test_release.py
          python3 tools/test_release_all.py
          pwsh -NoProfile -NonInteractive -Command '$tokens=$null; $errors=$null; [System.Management.Automation.Language.Parser]::ParseFile("windows/Cilexec.ps1", [ref]$tokens, [ref]$errors) | Out-Null; if ($errors.Count -ne 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }'
          cc -std=c11 -Wall -Wextra -Werror -O2 docker/terminal-client.c -o /tmp/cilexec-terminal-client
          docker compose -f compose.yml -f docker/compose/persistent.yml config --quiet
          CILEXEC_DATABASE_URL='jdbc:postgresql://db.example.invalid:5432/cilexec' \
            CILEXEC_POSTGRES_CA_FILE=/tmp/cilexec-postgres-ca.crt \
            docker compose -f docker/compose/external.yml config --quiet
      - name: Require Docker integration environment
        run: docker version
      - name: Verify Runtime and mandatory integration suites
        run: >-
          mvn --batch-mode --no-transfer-progress clean verify
          -Dbuild.revision="${GITHUB_SHA}"
          -Dcilexec.test.postgres.image="${{ matrix.postgres-image }}"
      - name: Reject missing or skipped mandatory tests
        run: python3 tools/check_test_reports.py
      - name: Upload Runtime quality reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runtime-reports-${{ strategy.job-index }}
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/site/jacoco/
            target/runtime-sbom.json
          if-no-files-found: error
          retention-days: 14

  market:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify Java 21 market server
        run: >-
          mvn --batch-mode --no-transfer-progress -f market-server/pom.xml clean verify
          -Dbuild.revision="${GITHUB_SHA}"
      - name: Upload market test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: market-reports
          path: |
            market-server/target/surefire-reports/
            market-server/target/site/jacoco/
            market-server/target/runtime-sbom.json
          if-no-files-found: error
          retention-days: 14

  image:
    needs: [runtime, market]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Read canonical release version
        id: version
        run: echo "value=$(./tools/Version.sh)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build amd64 and arm64 images
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          tags: cilexec:ci-multiarch
          build-args: |
            BUILD_VERSION=${{ steps.version.outputs.value }}
            BUILD_REVISION=${{ github.sha }}
          provenance: mode=max
          sbom: true
      - name: Load scan image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: cilexec:ci
          build-args: |
            BUILD_VERSION=${{ steps.version.outputs.value }}
            BUILD_REVISION=${{ github.sha }}
      - name: Scan image vulnerabilities
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7
        with:
          image: cilexec:ci
          fail-build: true
          severity-cutoff: high

  release-directory:
    needs: [runtime, market, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '26'
          cache: maven
      - name: Build release from the tested revision
        env:
          CILEXEC_BUILD_REVISION: ${{ github.sha }}
        run: |
          python3 tools/release.py --skip-tests
          python3 tools/release.py --verify-only
      - name: Upload verified release directory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-release-directory
          path: dist/
          if-no-files-found: error
          retention-days: 14
