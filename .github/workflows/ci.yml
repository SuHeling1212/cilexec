name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'
          cache: maven
      - name: Verify host tools
        run: |
          bash -n Install.sh Shell.sh Uninstall.sh HostMove.sh build/*.sh docker/create-secrets.sh
          sh -n docker/healthcheck.sh docker/postgres/init/00-cilexec-bootstrap.sh
          python3 -m py_compile PackageBuild.py build/release.py build/test_release.py
          python3 build/test_release.py
          cc -std=c11 -Wall -Wextra -Werror -O2 docker/terminal-client.c -o /tmp/cilexec-terminal-client
      - name: Verify Java build
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Verify market server build
        run: mvn --batch-mode --no-transfer-progress -f market-server/pom.xml clean verify
      - name: Verify complete release artifacts
        run: |
          python3 build/release.py --skip-tests
          python3 build/release.py --verify-only

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build amd64 and arm64 images
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          tags: cilexec:ci
